name: CI/CD Pipeline

on:
  push:
    branches: [ dev, main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build and test User Service
        run: |
          cd user-service
          mvn clean verify
        env:
          MAVEN_OPTS: -Xmx512m

      - name: Build and test Product Service
        run: |
          cd product-service
          mvn clean verify
        env:
          MAVEN_OPTS: -Xmx512m

      - name: Build and test Order Service
        run: |
          cd order-service
          mvn clean verify
        env:
          MAVEN_OPTS: -Xmx512m

      - name: Upload User Service test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-service-test-report
          path: user-service/target/surefire-reports/

      - name: Upload Product Service test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-service-test-report
          path: product-service/target/surefire-reports/

      - name: Upload Order Service test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-service-test-report
          path: order-service/target/surefire-reports/

      - name: Upload User Service coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: user-service-coverage-report
          path: user-service/target/site/jacoco/

      - name: Upload Product Service coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: product-service-coverage-report
          path: product-service/target/site/jacoco/

      - name: Upload Order Service coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: order-service-coverage-report
          path: order-service/target/site/jacoco/

  docker-build-push:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push User Service image
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: true
          tags: |
            ravenclaww/user-service:latest
            ravenclaww/user-service:${{ github.sha }}

      - name: Build and push Product Service image
        uses: docker/build-push-action@v5
        with:
          context: ./product-service
          push: true
          tags: |
            ravenclaww/product-service:latest
            ravenclaww/product-service:${{ github.sha }}

      - name: Build and push Order Service image
        uses: docker/build-push-action@v5
        with:
          context: ./order-service
          push: true
          tags: |
            ravenclaww/order-service:latest
            ravenclaww/order-service:${{ github.sha }}